	<main class="auth-card">
		<div class="brand"><span class="brand-mark">C</span><span>CASSARD <span class="eyebrow">PILOTAGE</span></span></div>
		<h1>Bienvenue à bord</h1>
		<p>Le mot de passe reste sur cet appareil : il sert à signer chaque commande envoyée au navire.</p>
		<form id="login-form" action="#" autocomplete="off">
			<label class="field-label" for="motDePasse">Mot de passe de pilotage</label>
			<input id="motDePasse" type="password" autocomplete="current-password" minlength="12" required>
			<button class="app-button" type="submit">Accéder au tableau de bord</button>

	<script src="_cassard-link.js"></script>
	<script>
		document.getElementById("login-form").addEventListener("submit", function(event)
		{
			event.preventDefault();
			var field = document.getElementById("motDePasse");
			document.getElementById("login-status").textContent = "Préparation de la clé…";
			setTimeout(function()
			{
				CassardLink.storePassword(field.value);
				field.value = "";
				location.replace("_CassardMenu.php");
			}, 20);
		});
	</script>
