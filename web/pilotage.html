<!doctype html>

<html lang="fr">
	<head>
		<meta charset="UTF-8">
		<title>Pilotage — Cassard</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="theme-color" content="#101215">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<script src="_cassard-link.js"></script>
		<style>
			html, body {
				background: #101215;
				height: 100%;
				margin: 0;
				overflow: hidden;
			}

			.screen {
				border: 0;
				display: none;
				height: 100%;
				left: 0;
				position: fixed;
				top: 0;
				width: 100%;
			}

			.screen.active {
				display: block;
			}

			.banner {
				align-items: center;
				background: #2a1a12;
				border: 1px solid #ff6a1a;
				border-radius: 12px;
				bottom: 16px;
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
				color: #ffd9c2;
				display: flex;
				font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				gap: 12px;
				left: 16px;
				padding: 12px 14px;
				position: fixed;
				right: 16px;
				z-index: 10;
			}

			.banner[hidden] {
				display: none;
			}

			.banner span {
				flex: 1;
			}

			.banner button {
				background: #ff6a1a;
				border: 0;
				border-radius: 8px;
				color: #1a0d05;
				cursor: pointer;
				font: 700 13px inherit;
				padding: 8px 12px;
			}
		</style>
	</head>
	<body>
		<div class="banner" id="reprise" hidden role="alert">
			<span>Un autre poste a pris la main sur le bateau.</span>
			<button type="button" id="reprendre">Reprendre la main</button>
		</div>

		<script>
			// Coquille de l'application : une seule connexion au bateau, ouverte dès le
			// mot de passe saisi ; chaque écran s'affiche dans un cadre qui reste chargé
			// (pas de coupure de liaison ni de perte de réglage en changeant d'écran).
			var SCREENS = ["_CassardMenu.html", "_CassardPropulsion.html", "_CassardTourelle.html",
				"_CassardInstruments.html", "_CassardSonsEtLumieres.html", "_CassardDebug.html"];
			var frames = {};
			var boat = null;

			function show(file)
			{
				if(SCREENS.indexOf(file) < 0)
				{
					file = SCREENS[0];
				}
				if(!frames[file])
				{
					var frame = document.createElement("iframe");
					frame.className = "screen";
					frame.title = file;
					frame.src = file;
					document.body.appendChild(frame);
					frames[file] = frame;
				}
				for(var name in frames)
				{
					frames[name].classList.toggle("active", name === file);
				}
			}

			if(!CassardLink.hasKey())
			{
				location.replace("index.html");
			}
			else
			{
				window.CassardShell = {
					attach: function(screenDocument) { return boat.attach(screenDocument); },
					show: function(file) { location.hash = file; },
					lock: function()
					{
						boat.close();
						location.replace("index.html");
					}
				};
				boat = CassardLink.connect({
					onstatus: function(status)
					{
						document.getElementById("reprise").hidden = status !== "reprise";
						if(status === "refuse")
						{
							CassardLink.forget();
							location.replace("index.html?refuse");
						}
					}
				});
				document.getElementById("reprendre").addEventListener("click", function()
				{
					boat.reconnect();
				});
				window.addEventListener("hashchange", function()
				{
					show(decodeURIComponent(location.hash.slice(1)));
				});
				show(decodeURIComponent(location.hash.slice(1)));
			}
		</script>
	</body>
</html>
